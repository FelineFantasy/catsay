[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catsay-py"
version = "0.1.1"
description = "A cute cat that says things in the terminal"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "FelineFantasy", email = "mailsalavata5@gmail.com"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Terminals",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
Homepage = "https://github.com/FelineFantasy/catsay"
Repository = "https://github.com/FelineFantasy/catsay"
Issues = "https://github.com/FelineFantasy/catsay/issues"

[tool.setuptools]
py-modules = ["catsay"]
